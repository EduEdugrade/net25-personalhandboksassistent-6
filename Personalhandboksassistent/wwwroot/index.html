<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalhandboksassistenten</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="js/app.js"></script>
</head>

<body>
    <header class="header">
        <div class="header-left">
            <div>
                <h1>Personalhandboksassistenten</h1>
                <p>Din AI-assistent för personalhandboken</p>
            </div>
        </div>

        <button class="logout-button" type="button">
            Logga ut
        </button>
    </header>


    <main class="main">
        <aside class="leftSection" id="adminPanel">
            <div class="sidebar-header">
                <div>
                    <h2>Dokument</h2>
                    <p>Personalhandbok & filer</p>
                </div>
            </div>

            <div class="documents" id="documents">
                <div class="document">
                    <div class="document-icon">📄</div>

                    <div class="document-info">
                        <span class="document-name">Personalhandbok.pdf</span>
                        <span class="document-meta">PDF</span>
                    </div>

                    <button class="delete-document" type="button" title="Ta bort dokument">x</button>
                </div>

                <div class="document">
                    <div class="document-icon">📄</div>

                    <div class="document-info">
                        <span class="document-name">Semester och ledighet.pdf</span>
                        <span class="document-meta">PDF</span>
                    </div>

                    <button class="delete-document" type="button" title="Ta bort dokument">x</button>
                </div>
            </div>

            <div class="sidebar-footer">
                <button id="addDocument" class="add-document">
                    <span>+</span>
                    Lägg till dokument
                </button>
                <input type="file" id="fileInput" style="display: none;">
            </div>
        </aside>

        <section class="rightSection">
            <div class="chat-container">
                <div class="chat-box" id="chat-box">
                    <div class="welcome-message">
                        <h2>Hej! Hur kan jag hjälpa dig?</h2>

                        <p>
                            Jag kan svara på frågor utifrån dokumenten
                            i personalhandboken.
                        </p>
                    </div>
                </div>

                <div class="user-input">
                    <input class="userQuestion" type="text" placeholder="Skriv din fråga..." autocomplete="off">

                    <button type="button" class="submitButton">
                        <span>Skicka</span>
                        <span class="send-icon">➤</span>
                    </button>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
