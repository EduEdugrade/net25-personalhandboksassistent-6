<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <title>Logga in</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="js/login.js"></script>
</head>

<body>
    <h1>Logga in</h1>

    <form id="loginForm">

        <button type="submit">Logga in</button>
    </form>

    <p id="error"></p>
</body>

</html>
